<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft blur & glow -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .beacon {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .float-pill-1 {
        animation: floatY1 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatY2 7s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: floatY3 8s ease-in-out infinite alternate;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes floatY1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatY2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes floatY3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
      }
      .text-pill {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic ambient background orbs (stay well behind text) -->
  <circle cx="180" cy="180" r="140" fill="url(#glowGrad1)" filter="url(#blurGlow)" class="beacon" />
  <circle cx="1020" cy="180" r="150" fill="url(#glowGrad2)" filter="url(#blurGlow)" class="beacon" />

  <!-- Subtle dynamic flow / circuit lines behind foreground content -->
  <path d="M 60 80 Q 300 20 600 80 T 1140 80" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.35" class="node-flow" />
  <path d="M 80 280 Q 400 340 700 280 T 1120 280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="node-flow" style="animation-direction: reverse;" />

  <!-- Animated Interactive Pills (positioned dynamically at sides/edges so title & subtitle remain 100% clear in foreground) -->
  <g class="float-pill-1">
    <rect x="90" y="46" width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="108" cy="63" r="5" fill="#38bdf8" />
    <text x="122" y="68" class="text-pill" fill="#e0f2fe">💡 Customer Feedback</text>
  </g>

  <g class="float-pill-2">
    <rect x="920" y="50" width="190" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="938" cy="67" r="5" fill="#818cf8" />
    <text x="952" y="72" class="text-pill" fill="#ede9fe">🎯 RICE &amp; Prioritization</text>
  </g>

  <g class="float-pill-3">
    <rect x="940" y="275" width="175" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="958" cy="292" r="5" fill="#c084fc" />
    <text x="972" y="297" class="text-pill" fill="#fdf4ff">🗺️ Dynamic Roadmaps</text>
  </g>

  <g class="float-pill-1">
    <rect x="90" y="275" width="195" height="34" rx="17" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="108" cy="292" r="5" fill="#34d399" />
    <text x="122" y="297" class="text-pill" fill="#ecfdf5">⚡ Discovery to Delivery</text>
  </g>

  <!-- Foreground Title and Centerpiece (Ensured clear, unobscured foreground) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <rect x="475" y="65" width="250" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="600" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="text-title" fill="url(#titleGrad)">Product Discovery &amp; Idea Management</text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="text-sub">Feedback Capture • Feature Request Voting • Idea Prioritization • Strategic Roadmaps</text>

    <!-- Decorative workflow indicator line below subtitle -->
    <line x1="420" y1="225" x2="780" y2="225" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <circle cx="460" cy="225" r="4" fill="#38bdf8" />
    <circle cx="550" cy="225" r="4" fill="#818cf8" />
    <circle cx="650" cy="225" r="4" fill="#a855f7" />
    <circle cx="740" cy="225" r="4" fill="#ec4899" />
    <text x="600" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Turning qualitative customer input into evidence-based product direction</text>
  </g>
</svg>